replicaCount: 2

image:
  repository: ghcr.io/asadullah48/accessai
  pullPolicy: IfNotPresent
  tag: "1.1.0"

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 8015

# Gateway configuration. Credentials are only ever sent to explicitly listed
# origins; pairing them with "*" is refused at startup.
config:
  environment: production
  logLevel: INFO
  corsOrigins: ""
  corsAllowCredentials: false
  logHealthProbes: false

# Matches the unprivileged user baked into the image (uid 10001).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}
