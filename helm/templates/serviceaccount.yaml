{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name | default (printf "%s-accessai" .Release.Name) }}
  labels:
    app.kubernetes.io/name: accessai
# The gateway calls no Kubernetes API, so it needs no mounted credential.
automountServiceAccountToken: false
{{- end }}
